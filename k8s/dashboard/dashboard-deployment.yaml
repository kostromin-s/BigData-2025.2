apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-dashboard
  namespace: bigdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamlit-dashboard
  template:
    metadata:
      labels:
        app: streamlit-dashboard
    spec:
      initContainers:
        - name: wait-for-namenode
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z namenode 9000; do
                echo "Waiting for HDFS NameNode..."; sleep 5;
              done
      containers:
        - name: dashboard
          image: streamlit-dashboard:latest
          # Dùng image local từ Minikube — không pull từ Docker Hub
          imagePullPolicy: Never
          ports:
            - containerPort: 8501
          env:
            - name: HDFS_NAMENODE
              value: "hdfs://namenode:9000"
            - name: HDFS_INPUT_PATH
              value: "/data/real-estate"
            - name: PYSPARK_PYTHON
              value: "python3"
            - name: PYSPARK_DRIVER_PYTHON
              value: "python3"
          volumeMounts:
            - name: dashboard-source
              mountPath: /app/dashboard.py
              subPath: dashboard.py
            - name: dashboard-source
              mountPath: /app/config.py
              subPath: config.py
      volumes:
        - name: dashboard-source
          configMap:
            name: dashboard-source
---
apiVersion: v1
kind: Service
metadata:
  name: streamlit-dashboard
  namespace: bigdata
spec:
  type: NodePort
  selector:
    app: streamlit-dashboard
  ports:
    - port: 8501
      targetPort: 8501
      nodePort: 30501
