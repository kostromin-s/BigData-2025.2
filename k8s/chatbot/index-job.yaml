# Job build vector index cho chatbot: đọc 300 tin -> embed e5-small -> Qdrant in-cluster.
# Chạy lại: kubectl delete job chatbot-index -n bigdata; kubectl apply -f k8s/chatbot/index-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: chatbot-index
  namespace: bigdata
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-qdrant
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z qdrant 6333; do echo waiting qdrant; sleep 3; done"]
      containers:
        - name: index
          image: chatbot:latest
          imagePullPolicy: Never        # build thẳng trong Minikube
          command: ["python", "build_index.py"]
          env:
            - name: QDRANT_URL
              value: "http://qdrant:6333"
            - name: QDRANT_COLLECTION
              value: "real_estate"
            - name: EMBED_MODEL
              value: "intfloat/multilingual-e5-small"
