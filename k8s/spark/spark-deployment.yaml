apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-consumer
  namespace: bigdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-consumer
  template:
    metadata:
      labels:
        app: spark-consumer
    spec:
      # Đợi Kafka và HDFS sẵn sàng trước khi khởi động
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka 9092; do
                echo "Waiting for Kafka..."; sleep 5;
              done
        - name: wait-for-namenode
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z namenode 9000; do
                echo "Waiting for HDFS NameNode..."; sleep 5;
              done
      containers:
        - name: spark-consumer
          image: spark-consumer:latest
          # Dùng image local từ Minikube — không pull từ Docker Hub
          imagePullPolicy: Never
          ports:
            - containerPort: 4040
              name: spark-ui
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KAFKA_TOPIC
              value: "real-estate-documents"
            - name: KAFKA_STARTING_OFFSET
              value: "earliest"
            - name: HDFS_NAMENODE
              value: "hdfs://namenode:9000"
            - name: HDFS_OUTPUT_PATH
              value: "/data/real-estate"
          volumeMounts:
            - name: spark-checkpoint
              mountPath: /tmp/spark-checkpoint
      volumes:
        - name: spark-checkpoint
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: spark-consumer-ui
  namespace: bigdata
spec:
  type: NodePort
  selector:
    app: spark-consumer
  ports:
    - port: 4040
      targetPort: 4040
      nodePort: 30404
