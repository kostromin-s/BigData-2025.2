# Headless service — cho StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: namenode-headless
  namespace: bigdata
spec:
  clusterIP: None
  selector:
    app: namenode
  ports:
    - name: rpc
      port: 9000
    - name: web-ui
      port: 9870
---
# ClusterIP service — các pod dùng "namenode:9000" để kết nối HDFS
apiVersion: v1
kind: Service
metadata:
  name: namenode
  namespace: bigdata
spec:
  type: ClusterIP
  selector:
    app: namenode
  ports:
    - name: rpc
      port: 9000
      targetPort: 9000
    - name: web-ui
      port: 9870
      targetPort: 9870
---
# NodePort — xem NameNode Web UI từ ngoài
apiVersion: v1
kind: Service
metadata:
  name: namenode-ui
  namespace: bigdata
spec:
  type: NodePort
  selector:
    app: namenode
  ports:
    - port: 9870
      targetPort: 9870
      nodePort: 30870
