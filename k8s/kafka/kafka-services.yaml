# Headless service — cho StatefulSet DNS (kafka-0.kafka-headless)
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: bigdata
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
    - name: controller
      port: 9093
---
# ClusterIP service — các pod khác dùng hostname "kafka" để kết nối
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: bigdata
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
---
# AKHQ UI — truy cập từ ngoài qua NodePort
apiVersion: apps/v1
kind: Deployment
metadata:
  name: akhq
  namespace: bigdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: akhq
  template:
    metadata:
      labels:
        app: akhq
    spec:
      containers:
        - name: akhq
          image: tchiotludo/akhq:latest
          ports:
            - containerPort: 8080
          env:
            - name: AKHQ_CONFIGURATION
              value: |
                akhq:
                  connections:
                    k8s-kafka:
                      properties:
                        bootstrap.servers: "kafka:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: akhq
  namespace: bigdata
spec:
  type: NodePort
  selector:
    app: akhq
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
