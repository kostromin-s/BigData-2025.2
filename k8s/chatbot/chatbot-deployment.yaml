apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot
  namespace: bigdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
    spec:
      containers:
        - name: chatbot
          image: chatbot:latest
          imagePullPolicy: Never        # build thẳng trong Minikube
          ports:
            - containerPort: 8501
          env:
            - name: QDRANT_URL
              value: "http://qdrant:6333"
            - name: QDRANT_COLLECTION
              value: "real_estate"
            - name: EMBED_MODEL
              value: "intfloat/multilingual-e5-small"
            - name: LLM_MODEL
              value: "llama-3.1-8b-instant"
            # Groq key lấy từ Secret (KHÔNG hardcode trong manifest)
            - name: GRSK
              valueFrom:
                secretKeyRef:
                  name: chatbot-secret
                  key: GRSK
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot
  namespace: bigdata
spec:
  type: NodePort
  selector:
    app: chatbot
  ports:
    - port: 8501
      targetPort: 8501
      nodePort: 30502
