services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - hdfs_network
    restart: unless-stopped

volumes:
  qdrant_storage:

networks:
  hdfs_network:
    external: true
    name: hdfs_hdfs_network